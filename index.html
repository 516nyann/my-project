<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプルアラーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>⏰ アラーム</h1>

    <div class="clock" id="clock">00:00:00</div>

    <div class="alarm-section">
      <label for="alarm-time">アラーム時刻</label>
      <input type="time" id="alarm-time" />
      <button id="set-btn" class="btn btn-set">セット</button>
      <button id="cancel-btn" class="btn btn-cancel" disabled>キャンセル</button>
    </div>

    <div class="status" id="status">アラームが設定されていません</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
